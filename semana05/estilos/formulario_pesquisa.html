<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="formulario_pesquisa.css">
</head>

<body>

    <header>
        <h1> Formulário de Pesquisa</h1>
    </header>

    <main>
        <form>

            <fieldset>
                <legend>Informações de Contato</legend>

                <label for="nome-completo">Nome Completo:</label>
                <input type="text" id="nome-completo" name="nome-completo" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

            </fieldset>

            <fieldset>
                <legend>Perguntas</legend>

                <label for="navegador">
                    Qual é o seu navegador favorito?
                </label>

                <select id="navegador" name="navegador">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>

                <label for="pet">
                    Você tem um animal de estimação?
                </label>

                <input type="checkbox" id="pet" name="pet">

                <label for="feedback">
                    Liste os lugares onde você morou:
                </label>

                <textarea id="feedback" name="feedback" rows="4"></textarea>

            </fieldset>

            <button type="submit">Enviar Pesquisa</button>

        </form>
    </main>

</body>

</html>
